<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Reis – Moesson Project</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e1b4b);
  color:white;
}

header{
  text-align:center;
  padding:25px;
  background:linear-gradient(90deg,#b91c1c,#f59e0b,#0ea5e9);
}

h1{
  margin:0;
}

.switch{
  margin-top:10px;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
  font-weight:bold;
}

.active{background:#f59e0b}
.inactive{background:#334155;color:white}

section{
  max-width:1000px;
  margin:auto;
  padding:25px;
}

#map{
  height:500px;
  border-radius:15px;
  border:2px solid gold;
}

.card{
  background:rgba(255,255,255,0.07);
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

/* POPUP */
#popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
}

#popupBox{
  background:#111827;
  padding:20px;
  border-radius:15px;
  max-width:500px;
}

#popupBox img{
  width:100%;
  border-radius:10px;
}

/* RAIN */
canvas{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  display:none;
  opacity:0.6;
}

footer{
  text-align:center;
  padding:20px;
  opacity:0.7;
}
</style>
</head>

<body>

<canvas id="rain"></canvas>

<header>
<h1>🇮🇳 India – Moesson Reis</h1>

<div class="switch">
<button id="dryBtn" class="active" onclick="setMode('dry')">☀️ Droog</button>
<button id="wetBtn" class="inactive" onclick="setMode('wet')">🌧️ Nat</button>
</div>
</header>

<section>
<h2>🗺️ Kaart</h2>
<div id="map"></div>
</section>

<section>
<h2>📅 Dagplanning</h2>
<div id="plan"></div>
</section>

<footer>
made by Dylan.L & Troy.k
</footer>

<!-- POPUP -->
<div id="popup" onclick="closePopup()">
<div id="popupBox">
<h2 id="title"></h2>
<img id="img">
<p id="text"></p>
</div>
</div>

<script>

/* MAP */
let map = L.map('map').setView([22.9,78.6],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let mode="dry";
let markers=[];

/* DATA */
const dry=[
{name:"Delhi",coords:[28.6,77.2],img:"https://upload.wikimedia.org/wikipedia/commons/1/10/India_Gate_in_New_Delhi_03-2016_img3.jpg",text:"Hoofdstad + gematigd klimaat"},
{name:"Jaipur",coords:[26.9,75.8],img:"https://upload.wikimedia.org/wikipedia/commons/9/99/Hawa_Mahal_2011.jpg",text:"Woestijnstad"},
{name:"Varanasi",coords:[25.3,82.9],img:"https://upload.wikimedia.org/wikipedia/commons/1/1e/Varanasi_Ghats.jpg",text:"Heilige Ganges stad"}
];

const wet=[
{name:"Kochi",coords:[9.9,76.2],img:"https://upload.wikimedia.org/wikipedia/commons/6/6f/Chinese_fishing_nets_Kochi.jpg",text:"Tropisch regenklimaat"},
{name:"Munnar",coords:[10.0,77.0],img:"https://upload.wikimedia.org/wikipedia/commons/0/0b/Munnar_Tea_plantation.jpg",text:"Theebergen + mist"},
{name:"Alleppey",coords:[9.5,76.3],img:"https://upload.wikimedia.org/wikipedia/commons/3/3a/Alleppey_backwaters.jpg",text:"Backwaters + moesson"}
];

/* LOAD MAP */
function load(data){
markers.forEach(m=>map.removeLayer(m));
markers=[];

data.forEach(p=>{
let m=L.marker(p.coords).addTo(map)
.on("click",()=>open(p));
markers.push(m);
});
}

/* POPUP */
function open(p){
document.getElementById("popup").style.display="flex";
document.getElementById("title").innerText=p.name;
document.getElementById("img").src=p.img;
document.getElementById("text").innerText=p.text;
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

/* PLAN */
function plan(){
document.getElementById("plan").innerHTML =
mode==="dry"
?
`<div class="card">Delhi → Red Fort + streetfood</div>
<div class="card">Jaipur → Amber Fort + woestijn</div>
<div class="card">Varanasi → Ganges boottocht</div>`
:
`<div class="card">Kochi → koloniale stad</div>
<div class="card">Munnar → theeplantages</div>
<div class="card">Alleppey → houseboat</div>`;
}

/* RAIN */
const canvas=document.getElementById("rain");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let drops=[];

function rainInit(){
drops=[];
for(let i=0;i<150;i++){
drops.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
l:Math.random()*20+10,
s:Math.random()*8+4
});
}
}

function rain(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.strokeStyle="rgba(180,200,255,0.6)";

for(let d of drops){
ctx.beginPath();
ctx.moveTo(d.x,d.y);
ctx.lineTo(d.x,d.y+d.l);
ctx.stroke();

d.y+=d.s;
if(d.y>canvas.height){
d.y=-20;
d.x=Math.random()*canvas.width;
}
}

if(mode==="wet")requestAnimationFrame(rain);
}

/* SWITCH */
function setMode(m){
mode=m;

document.getElementById("dryBtn").className=m==="dry"?"active":"inactive";
document.getElementById("wetBtn").className=m==="wet"?"active":"inactive";

load(m==="dry"?dry:wet);
plan();

if(m==="wet"){
canvas.style.display="block";
rainInit();
rain();
}else{
canvas.style.display="none";
}
}

setMode("dry");

</script>

</body>
</html>
