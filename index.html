<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India – Moesson Reis</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background: radial-gradient(circle at top, #7c2d12, #0f172a);
  color:white;
}

/* HEADER */
header{
  text-align:center;
  padding:30px;
  background:linear-gradient(90deg,#b91c1c,#f59e0b,#0ea5e9);
}

h1{margin:0}

/* BUTTONS */
.switch{
  margin-top:10px;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:12px;
  margin:5px;
  cursor:pointer;
  font-weight:bold;
}

.active{background:#f59e0b}
.inactive{background:#1f2937;color:white}

/* LAYOUT */
section{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.08);
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

/* MAP */
#map{
  height:500px;
  border-radius:15px;
  border:2px solid gold;
}

/* POPUP */
#popup{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.8);
}

#popupBox{
  background:#111827;
  padding:20px;
  border-radius:15px;
  max-width:500px;
}

#popupBox img{
  width:100%;
  border-radius:10px;
}

/* RAIN */
#rain{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  display:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  opacity:0.7;
}
</style>
</head>

<body>

<canvas id="rain"></canvas>

<header>
<h1>🇮🇳 India – Moesson Reis</h1>

<div class="switch">
<button id="dryBtn" class="active" onclick="setMode('dry')">☀️ Droog</button>
<button id="wetBtn" class="inactive" onclick="setMode('wet')">🌧️ Nat</button>
</div>
</header>

<section>
<h2>🗺️ Kaart</h2>
<div id="map"></div>
</section>

<section>
<h2>📅 Dagplanning</h2>
<div id="plan"></div>
</section>

<footer>
made by Dylan.L & Troy.k
</footer>

<!-- POPUP -->
<div id="popup" onclick="closePopup()">
  <div id="popupBox">
    <h2 id="title"></h2>
    <img id="img">
    <p id="text"></p>
  </div>
</div>

<script>

/* MAP INIT */
const map = L.map('map').setView([22.9,78.6],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let mode = "dry";
let markers = [];

/* DATA */
const dry = [
{
name:"Delhi",
coords:[28.6,77.2],
img:"https://upload.wikimedia.org/wikipedia/commons/1/10/India_Gate_in_New_Delhi_03-2016_img3.jpg",
text:"Hoofdstad, cultuur en markten"
},
{
name:"Jaipur",
coords:[26.9,75.8],
img:"https://upload.wikimedia.org/wikipedia/commons/9/99/Hawa_Mahal_2011.jpg",
text:"Woestijnstad en forten"
},
{
name:"Varanasi",
coords:[25.3,82.9],
img:"https://upload.wikimedia.org/wikipedia/commons/1/1e/Varanasi_Ghats.jpg",
text:"Heilige Ganges stad"
}
];

const wet = [
{
name:"Kochi",
coords:[9.9,76.2],
img:"https://upload.wikimedia.org/wikipedia/commons/6/6f/Chinese_fishing_nets_Kochi.jpg",
text:"Tropisch regenklimaat"
},
{
name:"Munnar",
coords:[10.0,77.0],
img:"https://upload.wikimedia.org/wikipedia/commons/0/0b/Munnar_Tea_plantation.jpg",
text:"Theeplantages in bergen"
},
{
name:"Alleppey",
coords:[9.5,76.3],
img:"https://upload.wikimedia.org/wikipedia/commons/3/3a/Alleppey_backwaters.jpg",
text:"Backwaters + moesson"
}
];

/* LOAD MAP */
function load(data){
markers.forEach(m => map.removeLayer(m));
markers = [];

data.forEach(p => {
let marker = L.marker(p.coords).addTo(map);
marker.on("click", () => openPopup(p));
markers.push(marker);
});
}

/* POPUP */
function openPopup(p){
document.getElementById("popup").style.display = "flex";
document.getElementById("title").innerText = p.name;
document.getElementById("img").src = p.img;
document.getElementById("text").innerText = p.text;
}

function closePopup(){
document.getElementById("popup").style.display = "none";
}

/* PLAN */
function renderPlan(){
const el = document.getElementById("plan");

if(mode === "dry"){
el.innerHTML = `
<div class="card">Dag 1-3 Delhi → Red Fort + streetfood</div>
<div class="card">Dag 4-6 Jaipur → Amber Fort + woestijn</div>
<div class="card">Dag 7-9 Varanasi → Ganges rituelen</div>
`;
} else {
el.innerHTML = `
<div class="card">Dag 1-3 Kochi → koloniale stad</div>
<div class="card">Dag 4-6 Munnar → thee + mist</div>
<div class="card">Dag 7-9 Alleppey → houseboat</div>
`;
}
}

/* RAIN */
const canvas = document.getElementById("rain");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let drops = [];

function rainInit(){
drops = [];
for(let i=0;i<120;i++){
drops.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
l:Math.random()*20+10,
s:Math.random()*8+4
});
}
}

function rain(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.strokeStyle = "rgba(180,200,255,0.6)";

for(let d of drops){
ctx.beginPath();
ctx.moveTo(d.x,d.y);
ctx.lineTo(d.x,d.y+d.l);
ctx.stroke();

d.y += d.s;
if(d.y > canvas.height){
d.y = -20;
d.x = Math.random()*canvas.width;
}
}

if(mode === "wet") requestAnimationFrame(rain);
}

/* SWITCH */
function setMode(m){
mode = m;

document.getElementById("dryBtn").className = m==="dry"?"active":"inactive";
document.getElementById("wetBtn").className = m==="wet"?"active":"inactive";

load(m==="dry"?dry:wet);
renderPlan();

if(m === "wet"){
canvas.style.display = "block";
rainInit();
rain();
}else{
canvas.style.display = "none";
}
}

setMode("dry");

</script>

</body>
</html>
